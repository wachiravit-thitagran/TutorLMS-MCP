name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: WordPress + Tutor LMS + MCP Adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WordPress test environment
        run: npx wp-env start

      - name: Install Tutor LMS and MCP Adapter
        run: |
          npx wp-env run cli wp plugin install tutor --activate
          npx wp-env run cli wp plugin install https://github.com/WordPress/mcp-adapter/releases/latest/download/mcp-adapter.zip --activate
          npx wp-env run cli wp plugin activate --all
          npx wp-env run cli wp plugin list

      - name: Verify required plugins
        run: |
          npx wp-env run cli wp plugin is-active tutor
          npx wp-env run cli wp plugin is-active mcp-adapter

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop WordPress environment
        if: always()
        run: npx wp-env stop
