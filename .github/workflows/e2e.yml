name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: WordPress + Tutor LMS + MCP Adapter (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            wordpress_core: ''
            tutor_version: '4.1.1'
            mcp_adapter_url: 'https://github.com/WordPress/mcp-adapter/releases/download/v0.7.0/mcp-adapter.zip'
            experimental: false
          - channel: upstream-latest
            wordpress_core: 'WordPress/WordPress#trunk'
            tutor_version: ''
            mcp_adapter_url: 'https://github.com/WordPress/mcp-adapter/releases/latest/download/mcp-adapter.zip'
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-fund

      - name: Start WordPress test environment
        shell: bash
        env:
          WORDPRESS_CORE: ${{ matrix.wordpress_core }}
        run: |
          set -euo pipefail
          if [ -n "$WORDPRESS_CORE" ]; then
            WP_ENV_CORE="$WORDPRESS_CORE" npx wp-env start
          else
            npx wp-env start
          fi

      - name: Install Tutor LMS and MCP Adapter
        shell: bash
        env:
          TUTOR_VERSION: ${{ matrix.tutor_version }}
          MCP_ADAPTER_URL: ${{ matrix.mcp_adapter_url }}
        run: |
          set -euo pipefail

          if [ -n "$TUTOR_VERSION" ]; then
            npx wp-env run cli wp plugin install tutor --version="$TUTOR_VERSION" --activate
          else
            npx wp-env run cli wp plugin install tutor --activate
          fi

          npx wp-env run cli wp plugin install "$MCP_ADAPTER_URL" --activate
          npx wp-env run cli wp plugin activate --all
          npx wp-env run cli wp plugin list

      - name: Verify required plugins
        run: |
          npx wp-env run cli wp plugin is-active tutor
          npx wp-env run cli wp plugin is-active mcp-adapter
          npx wp-env run cli wp plugin is-active TutorLMS-MCP

      - name: MCP protocol, data, and security E2E
        env:
          WP_BASE_URL: http://localhost:8888
          MCP_PROTOCOL_VERSION: '2025-11-25'
        run: bash tests/e2e/mcp-protocol.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.channel }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop WordPress environment
        if: always()
        run: npx wp-env stop
