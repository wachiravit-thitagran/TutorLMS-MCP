name: Build & Release

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Wait for companion workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          required=("Unit Tests" "E2E Tests" "SAST" "DAST")

          for workflow in "${required[@]}"; do
            echo "Waiting for $workflow on $RELEASE_SHA"

            for attempt in {1..30}; do
              row="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100"                 --jq "[.workflow_runs[] | select(.name == \"${workflow}\")] | sort_by(.run_started_at, .id) | last | [(.status // \"missing\"), (.conclusion // \"pending\"), (.html_url // \"\")] | @tsv")"

              IFS=$'\t' read -r status conclusion url <<< "$row"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::$workflow did not pass: $conclusion $url"
                  exit 1
                fi
                echo "$workflow passed."
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "::error::$workflow did not complete successfully within the release gate."
                exit 1
              fi

              sleep 20
            done
          done

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current="$(sed -n 's/^ \* Version:[[:space:]]*//p' tutorlms-mcp.php | head -n1 | tr -d '\r')"
          if ! printf '%s' "$current" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid plugin Version header: $current"
            exit 1
          fi

          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//' || true)"
          if [ -z "$latest" ]; then
            next="$current"
          elif [ "$current" != "$latest" ] && [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)" = "$current" ]; then
            next="$current"
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="$major.$minor.$((patch + 1))"
          fi

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Stamp release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s/^([[:space:]]*\*[[:space:]]*Version:[[:space:]]*).*/\1${VERSION}/" tutorlms-mcp.php
          sed -i -E "s/(define\( 'TUTORLMS_MCP_VERSION', ')[^']*(' \);)/\1${VERSION}\2/" tutorlms-mcp.php
          php -l tutorlms-mcp.php
          php -l includes/class-tutorlms-mcp.php

      - name: Build installable plugin ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build dist
          mkdir -p build/tutorlms-mcp dist

          cp tutorlms-mcp.php build/tutorlms-mcp/
          cp -R includes build/tutorlms-mcp/
          cp README.md build/tutorlms-mcp/

          (
            cd build
            zip -qr "../dist/tutorlms-mcp-${VERSION}.zip" tutorlms-mcp
          )

          sha256sum "dist/tutorlms-mcp-${VERSION}.zip" > "dist/tutorlms-mcp-${VERSION}.zip.sha256"

          unzip -Z1 "dist/tutorlms-mcp-${VERSION}.zip" | grep -qx 'tutorlms-mcp/tutorlms-mcp.php'
          unzip -Z1 "dist/tutorlms-mcp-${VERSION}.zip" | grep -qx 'tutorlms-mcp/includes/class-tutorlms-mcp.php'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tutorlms-mcp-${{ steps.version.outputs.version }}
          path: |
            dist/tutorlms-mcp-${{ steps.version.outputs.version }}.zip
            dist/tutorlms-mcp-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG"             "dist/tutorlms-mcp-${VERSION}.zip"             "dist/tutorlms-mcp-${VERSION}.zip.sha256"             --target "$RELEASE_SHA"             --title "TutorLMS MCP ${VERSION}"             --generate-notes
