name: Cleanup unintended v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-unintended-release.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the known unintended release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: '532bda820e3910e001035fcabede0c999a8148f4'
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 is already absent; nothing to clean."
            exit 0
          fi

          target="$(gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          if [ "$target" != "$EXPECTED_SHA" ]; then
            echo "::error::Refusing to delete v0.1.0 because target changed to $target."
            exit 1
          fi

          gh release delete v0.1.0 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          echo "Deleted unintended v0.1.0 release and tag."
