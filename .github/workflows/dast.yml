name: DAST

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap WordPress integration stack
        env:
          WORDPRESS_CHANNEL: stable
          TUTOR_VERSION: '4.1.1'
          MCP_ADAPTER_URL: 'https://github.com/WordPress/mcp-adapter/releases/download/v0.7.0/mcp-adapter.zip'
          ACTIVATE_PLUGIN_SLUG: TutorLMS-MCP
        run: bash tests/e2e/bootstrap-wordpress.sh

      - name: Resolve Docker host address
        run: |
          HOST_IP=$(ip -f inet -o addr show docker0 | awk '{print $4}' | cut -d '/' -f 1)
          echo "ZAP_TARGET=http://${HOST_IP}:8888" >> "$GITHUB_ENV"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ env.ZAP_TARGET }}
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: true
          artifact_name: zap-baseline-report

      - name: Stop WordPress environment
        if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down -v --remove-orphans
