name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: WordPress + Tutor LMS + MCP Adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WordPress test environment
        run: npx wp-env start

      - name: Install Tutor LMS and MCP Adapter
        run: |
          npx wp-env run cli wp plugin install tutor --activate
          npx wp-env run cli wp plugin install https://github.com/WordPress/mcp-adapter/releases/latest/download/mcp-adapter.zip --activate
          npx wp-env run cli wp plugin activate --all
          npx wp-env run cli wp plugin list

      - name: Verify required plugins
        run: |
          npx wp-env run cli wp plugin is-active tutor
          npx wp-env run cli wp plugin is-active mcp-adapter
          npx wp-env run cli wp plugin is-active TutorLMS-MCP

      - name: MCP protocol smoke - initialize, discover, execute
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://127.0.0.1:8888"
          ENDPOINT="${BASE_URL}/?rest_route=/mcp/mcp-adapter-default-server"

          for i in $(seq 1 30); do
            if curl --fail --silent "${BASE_URL}/?rest_route=/" >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::WordPress did not become ready."
              exit 1
            fi
            sleep 2
          done

          APP_PASS="$(
            npx wp-env run cli wp eval '
              $user = get_user_by( "login", "admin" );
              $created = WP_Application_Passwords::create_new_application_password(
                $user->ID,
                array( "name" => "TutorLMS MCP E2E" )
              );
              if ( is_wp_error( $created ) ) {
                fwrite( STDERR, $created->get_error_message() );
                exit( 1 );
              }
              echo "MCP_APP_PASS=" . $created[0] . PHP_EOL;
            ' | sed -n 's/^MCP_APP_PASS=//p' | tail -n1 | tr -d '\r'
          )"
          test -n "$APP_PASS"

          workdir="$(mktemp -d)"
          headers="${workdir}/headers.txt"
          body="${workdir}/body.json"

          # Unauthenticated MCP requests must not be accepted.
          unauth_status="$(curl -sS -o "${workdir}/unauth.json" -w '%{http_code}' \
            -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"unauth-test","version":"1.0.0"}}}')"
          test "$unauth_status" = "401"

          # Initialize an authenticated MCP session.
          init_status="$(curl --silent --show-error -D "$headers" -o "$body" -w '%{http_code}' \
            -X POST "$ENDPOINT" \
            --user "admin:${APP_PASS}" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"tutorlms-mcp-e2e","version":"1.0.0"}}}')"

          if [ "$init_status" != "200" ]; then
            echo "::error::MCP initialize failed with HTTP $init_status"
            cat "$body"
            exit 1
          fi

          grep -q '"jsonrpc"' "$body"
          grep -q '"result"' "$body"

          SESSION_ID="$(awk 'BEGIN{IGNORECASE=1} /^Mcp-Session-Id:/ {gsub("\\r","",$2); print $2}' "$headers" | tail -n1)"
          test -n "$SESSION_ID"

          # A non-initialize request without the session header must fail.
          missing_session_status="$(curl -sS -o "${workdir}/missing-session.json" -w '%{http_code}' \
            -X POST "$ENDPOINT" \
            --user "admin:${APP_PASS}" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          test "$missing_session_status" = "400"

          curl --fail --silent --show-error \
            -X POST "$ENDPOINT" \
            --user "admin:${APP_PASS}" \
            -H 'Content-Type: application/json' \
            -H "Mcp-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' >/dev/null

          # The default MCP server must expose the adapter meta-tools.
          tools_json="$(curl --fail --silent --show-error \
            -X POST "$ENDPOINT" \
            --user "admin:${APP_PASS}" \
            -H 'Content-Type: application/json' \
            -H "Mcp-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/list","params":{}}')"

          printf '%s' "$tools_json" | grep -q 'mcp-adapter-discover-abilities'
          printf '%s' "$tools_json" | grep -q 'mcp-adapter-get-ability-info'
          printf '%s' "$tools_json" | grep -q 'mcp-adapter-execute-ability'

          # TutorLMS MCP abilities must be discoverable through the real adapter.
          discover_json="$(curl --fail --silent --show-error \
            -X POST "$ENDPOINT" \
            --user "admin:${APP_PASS}" \
            -H 'Content-Type: application/json' \
            -H "Mcp-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            -d '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"mcp-adapter-discover-abilities","arguments":{}}}')"

          for ability in \
            'tutorlms/site-info' \
            'tutorlms/list-courses' \
            'tutorlms/get-course' \
            'tutorlms/get-course-structure' \
            'tutorlms/get-student-progress'; do
            printf '%s' "$discover_json" | grep -q "$ability"
          done

          # Execute a TutorLMS ability through MCP, not by calling PHP directly.
          execute_json="$(curl --fail --silent --show-error \
            -X POST "$ENDPOINT" \
            --user "admin:${APP_PASS}" \
            -H 'Content-Type: application/json' \
            -H "Mcp-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            -d '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"mcp-adapter-execute-ability","arguments":{"ability_name":"tutorlms/site-info","parameters":{}}}}')"

          printf '%s' "$execute_json" | grep -q 'wordpress_version'
          printf '%s' "$execute_json" | grep -q 'tutorlms'

          curl --fail --silent --show-error \
            -X DELETE "$ENDPOINT" \
            --user "admin:${APP_PASS}" \
            -H "Mcp-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' >/dev/null

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop WordPress environment
        if: always()
        run: npx wp-env stop
